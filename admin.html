<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Erika Life | Admin</title>
<link rel="icon" type="image/svg+xml" href="img/logo/ERIKA-rounded-icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
/* VOICE  : calm, clear studio desk for Erika
   IDEA   : a class register — one card per class, the people on it, their boots
   PICTURE: the next class leads the page with its boots meter
   COLOUR and TYPE: cream ground, plum ink, rose accent; Playfair + DM Sans
   LAYOUT : summary row, filters, class cards with attendee rows; phone first */
:root{color-scheme:light;--bg:#FBF7F4;--card:#fff;--ink:#2A1222;--mute:#7A6470;--line:rgba(42,18,34,.1);--rose:#CC3370;--rose-d:#A3214F;--blush:#F8E6EE;--plum:#2A1222;--ok:#2E7D5B;--serif:"Playfair Display",Georgia,serif;--sans:"DM Sans",system-ui,sans-serif}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:1100px;margin:0 auto;padding:0 max(4vw,16px)}
header{background:var(--plum);color:#FBF7F4;padding:18px 0}
header .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;color:#F48FB1;text-decoration:none}
.brand svg{height:34px;width:34px}.brand .wm{width:82px;height:35px}
header h1{font:400 22px var(--serif);margin:0 0 0 6px;color:#FBF7F4}
.hbtns{margin-left:auto;display:flex;gap:8px}
.pages{display:flex;gap:4px;background:rgba(251,247,244,.1);border-radius:999px;padding:3px;margin-left:8px}
.pages a{color:#FBF7F4;text-decoration:none;font:500 14px var(--sans);border-radius:999px;padding:8px 16px;min-height:36px;display:inline-flex;align-items:center}
.pages a[aria-current="page"]{background:#FBF7F4;color:var(--plum)}
button,.btn{font:500 15px var(--sans);border-radius:999px;border:1px solid transparent;min-height:44px;padding:0 18px;cursor:pointer;background:var(--rose);color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
button.ghost{background:transparent;color:inherit;border-color:currentColor}
button.small{min-height:36px;padding:0 14px;font-size:14px}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #F48FB1;outline-offset:2px}
main.wrap{padding-top:26px;padding-bottom:60px}
[hidden]{display:none!important}
.note{background:var(--blush);border-radius:18px;padding:16px 18px;margin-bottom:18px;font-size:15px}
.note b{color:var(--rose-d)}
.login{max-width:420px;margin:40px auto;background:var(--card);border-radius:24px;padding:28px;border:1px solid var(--line)}
.login h2{font:400 30px var(--serif);margin:0 0 6px}
.login input,.tools input{width:100%;font:16px var(--sans);min-height:48px;border-radius:14px;border:1px solid var(--line);padding:0 14px;background:#FCF9F7;margin:14px 0}
.err{color:#B3261E;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-bottom:22px}
.stat{background:var(--card);padding:18px 20px}
.stat b{display:block;font:400 32px/1.15 var(--serif);color:var(--ink)}
.stat b.rose{color:var(--rose)}
.stat span{font-size:14px;color:var(--mute)}
h2.sec{font:400 22px var(--serif);margin:28px 0 12px}
.ins{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 20px}
.box h3{font:500 15px var(--sans);margin:0 0 4px;color:var(--mute)}
.box .big{font:400 24px var(--serif);margin:0 0 12px}
.bar{display:grid;grid-template-columns:7.5em minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px;margin:7px 0}
.bar .t{height:10px;border-radius:10px;background:#F3E8EC;overflow:hidden}.bar .t i{display:block;height:100%;border-radius:10px;background:var(--rose)}
.bar .t i.dim{background:#E3B9CB}
.bar b{font-weight:500;white-space:nowrap;text-align:right}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:28px 0 12px}
.tools h2{font:400 22px var(--serif);margin:0 auto 0 0}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{background:transparent;color:var(--ink);min-height:36px;padding:0 14px;font-size:14px}
.tabs button[aria-pressed="true"]{background:var(--plum);color:#fff}
.tools input{margin:0;width:220px;min-height:40px;font-size:15px}
.class{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:12px;overflow:hidden}
.ch{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;padding:14px 18px;border-bottom:1px solid var(--line)}
.ch h3{font:400 20px var(--serif);margin:0}
.ch .where{color:var(--mute);font-size:14px}
.ch .count{margin-left:auto;font-size:14px;color:var(--mute)}
.p{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 5.5em auto;gap:8px 14px;align-items:center;padding:11px 18px;border-bottom:1px solid var(--line);font-size:15px}
.p:last-child{border-bottom:0}
.p .nm{font-weight:500}
.p .sub{font-size:13px;color:var(--mute)}
.p .notes{grid-column:1/-1;font-size:13px;color:var(--mute)}
.p a.wa{color:var(--rose-d);text-decoration:none;white-space:nowrap}
.tag{font-size:12px;color:var(--rose-d);margin-left:6px;white-space:nowrap}
.boot{white-space:nowrap}
.paid{background:#fff;color:var(--ink);border-color:var(--line)}
.paid[aria-pressed="true"]{background:var(--ok);color:#fff;border-color:var(--ok)}
.x{background:none;border:0;color:var(--mute);min-height:36px;padding:0 6px;font-size:13px;text-decoration:underline}
.p.cancelled{opacity:.45}.p.cancelled .nm{text-decoration:line-through}
.cal{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px;align-items:start;margin-bottom:8px}
.cbox{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 16px 12px}
.chead{display:flex;align-items:center;gap:8px;margin-bottom:10px}.chead b{font:400 20px var(--serif);margin-right:auto}
.chead button{min-height:34px;width:34px;padding:0;justify-content:center;font-size:20px;line-height:1;background:transparent;color:var(--ink);border:1px solid var(--line)}
.cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cgrid .wd{font-size:12px;color:var(--mute);padding:4px 0}
.cgrid .d{position:relative;aspect-ratio:1;border-radius:12px;border:1px solid transparent;background:none;color:var(--ink);font:400 14px var(--sans);min-height:0;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:default}
.cgrid .d.cls{background:var(--blush);cursor:pointer}.cgrid .d.cls:hover{border-color:var(--rose)}
.cgrid .d.past{opacity:.5}.cgrid .d.today{border-color:var(--ink)}
.cgrid .d.sel{background:var(--plum);color:#fff}
.cgrid .d i{font-style:normal;font-size:11px;color:var(--rose-d);font-weight:500;line-height:1}.cgrid .d.sel i{color:#F48FB1}
.clegend{font-size:12px;color:var(--mute);margin:10px 2px 0}
.dpanel h3{font:400 22px var(--serif);margin:0 0 4px}.dpanel .sub{color:var(--mute);font-size:14px;margin:0 0 12px}
.slot{border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden;background:var(--card)}
.slot .sh{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;padding:12px 16px;background:#FCF7F9;border-bottom:1px solid var(--line)}
.slot .sh b{font-weight:500}.slot .sh span{font-size:13px;color:var(--mute)}.slot .sh .n{margin-left:auto;color:var(--rose-d);font-weight:500;font-size:14px}
.slot .none{padding:12px 16px;color:var(--mute);font-size:14px}
.att{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:6px 12px;align-items:center;padding:10px 16px;border-top:1px solid var(--line);font-size:14px}
.att:first-of-type{border-top:0}.att .nm{font-weight:500}.att a{color:var(--rose-d);text-decoration:none;white-space:nowrap}
.att.gone .nm{text-decoration:line-through;color:var(--mute)}
.att .ask{font-size:12px;color:#fff;background:var(--rose);border-radius:999px;padding:2px 8px;margin-left:6px;white-space:nowrap}
.rm{background:transparent;color:#B3261E;border:1px solid rgba(179,38,30,.35);min-height:34px;padding:0 12px;font-size:13px}
.rm.undo{color:var(--ink);border-color:var(--line)}
.rf{font-size:12px;color:var(--mute);grid-column:1/-1}
@media(max-width:760px){.cal{grid-template-columns:minmax(0,1fr)}.att{grid-template-columns:minmax(0,1fr) auto}}
.p.rq{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 9.5em auto}.p.rdone{opacity:.55}
.empty{text-align:center;color:var(--mute);padding:30px 0}
.stats.fin{grid-template-columns:repeat(3,minmax(0,1fr))}
.stat b.ok{color:var(--ok)}.stat b.neg{color:#B3261E}
.ef{display:grid;grid-template-columns:9.5em minmax(0,1fr) minmax(0,1.4fr) 7em 7.5em;gap:10px;align-items:end;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin-bottom:12px}
.ef label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute)}
.ef input,.ef select{font:15px var(--sans);min-height:42px;border-radius:12px;border:1px solid var(--line);padding:0 10px;background:#FCF9F7;color:var(--ink);width:100%}
.ef .wide{grid-column:1/-2}.ef .rt[hidden]{display:none}
.ef button{justify-content:center;white-space:nowrap;padding:0 14px}
.ef .wide{grid-column:1/-2}.ef:has(.rt:not([hidden])) .wide{grid-column:1/-3}
.p.ex{grid-template-columns:6.5em minmax(0,1.4fr) minmax(0,1fr) auto}
.amt{font-weight:500;white-space:nowrap;text-align:right}.amt small{display:block;font-weight:400;font-size:12px;color:var(--mute)}
@media(max-width:760px){.stats.fin{grid-template-columns:minmax(0,1fr)}.ef{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.ef .wide,.ef .it{grid-column:1/-1}.p.ex{grid-template-columns:minmax(0,1fr) auto}.p.ex>.sub:first-child{grid-column:1/-1;font-size:13px!important}.ef button{grid-column:1/-1}}
@media(max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.ins{grid-template-columns:minmax(0,1fr)}.p{grid-template-columns:minmax(0,1fr) auto}.p .acts{grid-column:1/-1;display:flex;gap:8px;align-items:center}.tools input{width:100%}header h1{display:none}.pages{margin-left:0}.bar{grid-template-columns:6.5em minmax(0,1fr) auto}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="defs"></defs></svg>
<header><div class="wrap">
  <a class="brand" href="index.html" aria-label="Erika, website"><svg><use href="#bloom"/></svg><svg class="wm"><use href="#wm"/></svg></a>
  <h1>Admin</h1>
  <nav class="pages" aria-label="Admin pages"><a href="#bookings" data-pg="bookings">Bookings</a><a href="#finance" data-pg="finance">Finance</a></nav>
  <div class="hbtns"><a class="btn ghost small" href="https://analytics.google.com/analytics/web/?authuser=erika.bouncefit@gmail.com" target="_blank" rel="noopener">Visitors</a><button class="ghost small" id="refresh" type="button">Refresh</button><button class="ghost small" id="csv" type="button">Download CSV</button><button class="ghost small" id="out" type="button" hidden>Sign out</button></div>
</div></header>
<main class="wrap" id="app"></main>

<script src="js/erika-config.js?v=2"></script>
<script>
{
const API=window.ERIKA_API||'';
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TIMES={'18':'6–7 PM','19':'7–8 PM','20':'8–9 PM'};
const DAYF=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const nice=d=>{const x=new Date(d+'T00:00');return isNaN(x)?d:`${DAYF[x.getDay()]} ${x.getDate()} ${MON[x.getMonth()]}`};
let KEY='';try{KEY=localStorage.getItem('erika-admin-key')||''}catch(e){}
let CAL=null,SEL=null,REQS=[],DATA=null,ORDERS=[],EXPS=[],STOCK={S:2,M:8,L:1},VIEW='up',Q='',SAMPLE=false;

/* logo symbols from the home page */
fetch('index.html').then(r=>r.text()).then(t=>{const m=t.match(/<symbol id="bloom"[\s\S]*?<\/symbol>/),w=t.match(/<symbol id="wm"[\s\S]*?<\/symbol>/);$('#defs').innerHTML=(m?m[0]:'')+(w?w[0]:'')}).catch(()=>{});

const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
function waLink(n){let d=String(n).replace(/\D/g,'');if(d.startsWith('01'))d='2'+d;return 'https://wa.me/'+d}

function sample(){
  SAMPLE=true;
  ORDERS=[
    {id:'B1A2B',created:'2026-11-24 21:15',edition:'Luxury',colour:'Rose gold',size:'M',qty:'1',total:'25000',deposit:'12500',name:'Hana Mostafa',whatsapp:'011 1148 5364',notes:'Delivery to Sheikh Zayed',paid:'deposit',status:'ordered'},
    {id:'B3C4D',created:'2026-11-25 10:40',edition:'Modified',colour:'Pink springs',size:'S',qty:'1',total:'18000',deposit:'9000',name:'Salma Adel',whatsapp:'011 1037 5091',notes:'',paid:'no',status:'ordered'},
    {id:'B5E6F',created:'2026-11-25 18:05',edition:'Kids',colour:'White and pink',size:'XS',qty:'2',total:'32000',deposit:'16000',name:'Dina Samir',whatsapp:'010 1111 5273',notes:'For my twins',paid:'full',status:'ordered'}];
  const names=['Nour Hassan','Salma Adel','Mariam Fawzy','Dina Samir','Hana Mostafa','Yasmin Ali','Farida Kamal','Laila Omar','Rana Tarek','Mai Sherif','Aya Nabil','Jana Wael','Noha Fathy','Malak Ehab'];
  const cls=[['New Cairo','2026-12-01','18'],['New Cairo','2026-12-01','19'],['Heliopolis','2026-12-02','19'],['Heliopolis','2026-12-02','20'],['New Cairo','2026-12-06','19'],['Heliopolis','2026-12-07','18']];
  const boots=['M','M','S','own','M','L','M','S','M','own','M','S','M','M'];
  const hrs=['21:10','20:45','13:05','22:30','21:55','09:40','19:20','21:35','12:15','22:05','20:10','08:55','21:40','17:30'];
  EXPS=[{id:'E0001',date:'2026-11-01',category:'Tools & software',item:'Claude Pro (Nov, incl. VAT)',amount:'22.80',currency:'USD',rate:'52',egp:'1185.60',notes:'Project + website',status:'active'},
    {id:'E0002',date:'2026-11-14',category:'Tools & software',item:'ChatGPT Plus (Nov, incl. VAT)',amount:'22.80',currency:'USD',rate:'52',egp:'1185.60',notes:'Logo, identity, website photos',status:'active'},
    {id:'E0003',date:'2026-11-26',category:'Website',item:'Domain erikalife.com (1 year, Squarespace)',amount:'22.00',currency:'USD',rate:'52',egp:'1144.00',notes:'Renews Nov 2027',status:'active'}];
  REQS=[{id:'R0C1X',created:'2026-11-27 09:30',topic:'Cancel a booking',name:'Nour Hassan',email:'nour@example.com',phone:'010 1000 0000',message:'Class date: 2026-12-01. I cannot come, please cancel.',source:'Direct',page:'/',status:'new'},{id:'R1A2B',created:'2026-11-26 21:10',topic:'Book a class',name:'Nour Hassan',email:'nour@example.com',phone:'010 1234 5678',message:'Is there a class for beginners on Sunday?',source:'instagram.com',page:'/',status:'new'},
    {id:'R3C4D',created:'2026-11-26 14:02',topic:'Sponsorship',name:'Omar Fathy',email:'omar@brand.example',phone:'',message:'We would like to sponsor The Bounce Run.',source:'google.com',page:'/',status:'replied'},
    {id:'R5E6F',created:'2026-11-25 19:45',topic:'Buy boots',name:'Mai Sherif',email:'mai@example.com',phone:'011 2222 3333',message:'Do you have size M in pink?',source:'Facebook / Instagram',page:'/boots.html',status:'done'}];
  return names.map((n,k)=>{const c=cls[k%cls.length];return {id:'S'+String(100+k),created:`2026-11-${String(20+(k%6)).padStart(2,'0')} ${hrs[k]}`,studio:c[0],date:c[1],time:c[2],classKey:c.join('|'),boots:boots[k],name:n,whatsapp:'01'+String(k%3)+' '+String(1000+k*37).slice(0,4)+' '+String(5000+k*91).slice(0,4),first:k%2?'I’ve tried before':'Yes, first time!',notes:k===2?'Knee was injured last year':'',price:'500',paid:k%3?'yes':'no',status:k===9?'cancelled':'booked'}});
}
async function load(){
  if(!API){DATA=sample();render();return}
  if(!KEY){login();return}
  $('#app').innerHTML='<p class="empty">Loading bookings…</p>';
  try{const r=await fetch(API+'?key='+encodeURIComponent(KEY));const j=await r.json();
    if(!j.ok){KEY='';try{localStorage.removeItem('erika-admin-key')}catch(e){}login('That key did not work. Try again.');return}
    DATA=j.rows||[];ORDERS=j.orders||[];REQS=j.requests||[];EXPS=j.expenses||[];if(j.stock)STOCK=j.stock;render()}
  catch(e){$('#app').innerHTML='<p class="empty">Could not reach the bookings sheet. Check your connection and press Refresh.</p>'}
}
function login(msg){
  $('#out').hidden=true;
  $('#app').innerHTML=`<form class="login" id="lf"><h2>Welcome back</h2><p style="margin:0;color:var(--mute)">Enter Erika’s admin key to see the bookings.</p>
  <input id="key" type="password" autocomplete="current-password" aria-label="Admin key" placeholder="Admin key" required>${msg?`<p class="err">${esc(msg)}</p>`:''}<button type="submit">Open bookings</button></form>`;
  $('#lf').addEventListener('submit',e=>{e.preventDefault();KEY=$('#key').value.trim();try{localStorage.setItem('erika-admin-key',KEY)}catch(e){}load()});
  $('#key').focus();
}

const money=n=>Math.round(n).toLocaleString('en-US')+' EGP';
const bars=(items,fmt,dimKey)=>{const mx=Math.max(1,...items.map(x=>x.v));return items.map(x=>`<div class="bar"><span>${esc(x.l)}</span><span class="t"><i class="${x.dim?'dim':''}" style="width:${x.v/mx*100}%"></i></span><b>${esc(fmt?fmt(x.v):x.v)}</b></div>`).join('')};
const top=items=>items.slice().sort((a,b)=>b.v-a.v)[0];
function render(){
  $('#out').hidden=!API;
  const t=today();
  const live=DATA.filter(r=>r.status!=='cancelled');
  const price=r=>+String(r.price).replace(/[^\d.]/g,'')||0;
  const paidRev=live.filter(r=>r.paid==='yes').reduce((a,r)=>a+price(r),0);
  const allRev=live.reduce((a,r)=>a+price(r),0);
  const up=live.filter(r=>r.date>=t);
  const unpaid=live.filter(r=>r.paid!=='yes');
  const next=up.map(r=>r.date+'|'+r.time).sort()[0];
  // insights
  const places=[...new Set(live.map(r=>r.studio))].map(p=>({l:p,v:live.filter(r=>r.studio===p).length})).sort((a,b)=>b.v-a.v);
  const sizes=['S','M','L','own'].map(z=>({l:z==='own'?'Own boots':'Size '+z,v:live.filter(r=>r.boots===z).length}));
  const slots=Object.keys(TIMES).map(k=>({l:TIMES[k],v:live.filter(r=>r.time===k).length}));
  const buckets=[['Morning',6,12],['Afternoon',12,17],['Evening',17,21],['Night',21,30]].map(([l,a,b])=>({l,v:live.filter(r=>{let h=+String(r.created).slice(11,13);if(h<6)h+=24;return h>=a&&h<b}).length}));
  const hours={};live.forEach(r=>{const h=+String(r.created).slice(11,13);if(!isNaN(h))hours[h]=(hours[h]||0)+1});
  const ph=Object.entries(hours).sort((a,b)=>b[1]-a[1])[0];
  const hr=h=>{h=+h;const ap=h<12?'AM':'PM',x=h%12||12;return x+' '+ap};
  const wd={};live.forEach(r=>{const d=new Date(String(r.created).slice(0,10)+'T00:00');if(!isNaN(d))wd[d.getDay()]=(wd[d.getDay()]||0)+1});
  const pd=Object.entries(wd).sort((a,b)=>b[1]-a[1])[0];
  const topSize=top(sizes),topSlot=top(slots);
  const liveO=ORDERS.filter(o=>o.status!=='cancelled');const num=v=>+String(v).replace(/[^\d.]/g,'')||0;
  const bootsTot=liveO.reduce((a,o)=>a+num(o.total),0),bootsIn=liveO.reduce((a,o)=>a+(o.paid==='full'?num(o.total):o.paid==='deposit'?num(o.deposit):0),0);
  const edBars=[...new Set(liveO.map(o=>o.edition))].map(e=>({l:e,v:liveO.filter(o=>o.edition===e).reduce((a,o)=>a+num(o.total),0)})).sort((a,b)=>b.v-a.v);
  syncPage();

const SCHED=[{studio:'New Cairo',days:[0,2]},{studio:'Heliopolis',days:[1,3]}],SLOTS=['18','19','20'],WDS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const isoD=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const digits=v=>String(v||'').replace(/\D/g,'').replace(/^20/,'0').slice(-10);
function classesOn(iso){
  const d=new Date(iso+'T00:00'),out=[];
  SCHED.forEach(s=>{if(s.days.includes(d.getDay()))SLOTS.forEach(t=>out.push({studio:s.studio,time:t}))});
  (DATA||[]).filter(r=>r.date===iso).forEach(r=>{if(!out.some(c=>c.studio===r.studio&&c.time===r.time))out.push({studio:r.studio,time:r.time})});
  return out.sort((a,b)=>(a.studio+a.time).localeCompare(b.studio+b.time));
}
function calSection(){

  if(!SEL){const up=(DATA||[]).filter(r=>r.status!=='cancelled'&&r.date>=t).map(r=>r.date).sort()[0];SEL=up||t}
  const first=new Date(CAL.y,CAL.m,1),days=new Date(CAL.y,CAL.m+1,0).getDate();
  let cells=WDS.map(w=>`<span class="wd">${w}</span>`).join('')+'<span></span>'.repeat(first.getDay());
  for(let i=1;i<=days;i++){
    const iso=isoD(new Date(CAL.y,CAL.m,i)),cl=classesOn(iso),n=(DATA||[]).filter(r=>r.date===iso&&r.status!=='cancelled').length;
    const c=['d',cl.length?'cls':'',iso<t?'past':'',iso===t?'today':'',iso===SEL?'sel':''].join(' ');
    cells+=cl.length?`<button type="button" class="${c}" data-day="${iso}" aria-label="${esc(nice(iso))}, ${n} booked">${i}${n?`<i>${n}</i>`:''}</button>`:`<span class="${c}">${i}</span>`;
  }
  const cl=classesOn(SEL);

  const asked=r=>asks.some(q=>(q.phone&&digits(q.phone)===digits(r.whatsapp))||(q.name&&q.name.trim().toLowerCase()===String(r.name).trim().toLowerCase()));
  const slot=c=>{const list=(DATA||[]).filter(r=>r.date===SEL&&r.studio===c.studio&&r.time===c.time).sort((a,b)=>a.created.localeCompare(b.created));const live=list.filter(r=>r.status!=='cancelled');
    const boots=Object.keys(STOCK).map(s=>`${s} ${live.filter(r=>r.boots===s).length}/${STOCK[s]}`).join(' · ');
    return `<div class="slot"><div class="sh"><b>${esc(TIMES[c.time]||c.time)}</b><span>${esc(c.studio)} · Boots ${esc(boots)}</span><span class="n">${live.length} booked</span></div>

      <a href="${esc(waLink(r.whatsapp))}" target="_blank" rel="noopener">${esc(r.whatsapp)}</a>
      <button class="small paid" type="button" data-paid="${esc(r.id)}" aria-pressed="${r.paid==='yes'}">${r.paid==='yes'?'Paid':'Mark paid'}</button>
      <button class="rm${r.status==='cancelled'?' undo':''}" type="button" data-rm="${esc(r.id)}">${r.status==='cancelled'?'Restore':'Remove'}</button>
      ${r.status==='cancelled'&&r.paid==='yes'?'<span class="rf">Removed. Refund if they cancelled 2+ hours before the class.</span>':''}</div>`).join(''):'<p class="none">No bookings yet.</p>'}</div>`};
  return `<div class="cal"><div class="cbox"><div class="chead"><b>${MON[CAL.m]} ${CAL.y}</b><button type="button" data-cm="-1" aria-label="Previous month">&lsaquo;</button><button type="button" data-cm="1" aria-label="Next month">&rsaquo;</button></div>
    <div class="cgrid">${cells}</div><p class="clegend">Pink days have classes. The number shows people booked.</p></div>
    <div class="dpanel"><h3>${esc(nice(SEL))}</h3><p class="sub">${cl.length?cl.length+' classes · '+(DATA||[]).filter(r=>r.date===SEL&&r.status!=='cancelled').length+' people booked':'No classes on this day'}</p>${cl.map(slot).join('')}</div></div>`;
}

function finWire(){

    const ex={date:$('#ed').value,category:$('#ec').value,item:$('#ei').value.trim(),amount:amount.toFixed(2),currency,rate:String(rate),egp:(amount*rate).toFixed(2),notes:$('#en').value.trim(),status:'active'};
    if(!ex.item||!amount)return;
    const b=$('#eb');b.disabled=true;b.textContent='Saving…';
    if(!API){ex.id='E'+Date.now().toString(36).slice(-5).toUpperCase();EXPS.push(ex);render();return}
    try{const r=await fetch(API,{method:'POST',body:JSON.stringify({action:'addExpense',key:KEY,...ex})});const j=await r.json();if(!j.ok)throw 0;ex.id=j.id;EXPS.push(ex);render();alertBar('Expense added.')}

    if(!confirmInline(b,'Delete'))return;const e=EXPS.find(x=>x.id===b.dataset.edel);if(!e)return;e.status='deleted';render();

    try{const r=await fetch(API,{method:'POST',body:JSON.stringify({action:'update',kind:'expense',key:KEY,id:e.id,status:'deleted'})});const j=await r.json();if(!j.ok)throw 0}

  }));
  const c=$('#expcsv');if(c)c.addEventListener('click',()=>{const H=['id','date','category','item','amount','currency','rate','egp','notes'];

  catch(e){Object.assign(r,prev);render();alertBar('Could not save that change. Try again.')}
}
function alertBar(m){const n=document.createElement('div');n.className='note';n.innerHTML='<b>'+esc(m)+'</b>';$('#app').prepend(n);setTimeout(()=>n.remove(),4000)}
$('#refresh').addEventListener('click',load);
$('#out').addEventListener('click',()=>{KEY='';try{localStorage.removeItem('erika-admin-key')}catch(e){}DATA=null;login()});
$('#csv').addEventListener('click',()=>{if(!DATA)return;const H=['id','created','studio','date','time','boots','name','whatsapp','first','notes','price','paid','status'];
  const csv=[H.join(',')].concat(DATA.map(r=>H.map(h=>'"'+String(r[h]??'').replace(/"/g,'""')+'"').join(','))).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv'}));a.download='erika-bookings.csv';a.click();
  if(REQS.length){const RH=['id','created','topic','name','email','phone','message','source','page','status'];const c2=[RH.join(',')].concat(REQS.map(r=>RH.map(h=>'"'+String(r[h]??'').replace(/"/g,'""')+'"').join(','))).join('\n');setTimeout(()=>{const b=document.createElement('a');b.href=URL.createObjectURL(new Blob(['\ufeff'+c2],{type:'text/csv'}));b.download='erika-requests.csv';b.click()},400)}});
load();
}
</script>
